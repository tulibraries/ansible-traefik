# tasks file for kibatic.traefik
---
- name: Ensure tar is installed
  ansible.builtin.package:
    name: tar
    state: present

- name: Download Untarred Traefik binary
  ansible.builtin.get_url:
    url: "{{ traefik_binary_url }}"
    dest: "{{ traefik_bin_path }}"
    owner: root
    group: root
    mode: "0755"
    force: "{{ traefik_update }}"
  when: not traefik_binary_url.endswith(".tar.gz")

- name: Ensure tmp directory
  ansible.builtin.file:
    path: "{{ traefik_tmp_path }}"
    state: directory
    mode: "1777"
  when: traefik_binary_url.endswith(".tar.gz")

- name: Download & Expand Tarred Traefik binary
  ansible.builtin.unarchive:
    src: "{{ traefik_binary_url }}"
    creates: "{{ traefik_tmp_path }}/traefik"
    remote_src: true
    dest: "{{ traefik_tmp_path }}"
    mode: "0755"
  when: traefik_binary_url.endswith(".tar.gz")

- name: Copy Expanded Traefik binary only to bin path
  ansible.builtin.copy:
    src: "{{ traefik_tmp_path }}/traefik"
    remote_src: true
    dest: "{{ traefik_bin_path }}"
    owner: root
    group: root
    mode: "0755"
    force: "{{ traefik_update }}"
  when: traefik_binary_url.endswith(".tar.gz")

- name: Create traefik systemd unit
  ansible.builtin.template:
    src: "{{ traefik_systemd_unit_template }}.j2"
    dest: "{{ traefik_systemd_unit_dest }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload traefik unit
    - Restart traefik

- name: Ensure install & config directory exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  with_items:
    - "{{ traefik_install_dir }}"

- name: Ensure /etc/traefik exists
  ansible.builtin.file:
    path: /etc/traefik
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy traefik config file
  ansible.builtin.template:
    src: "{{ traefik_template }}.j2"
    dest: "{{ traefik_config_file }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart traefik

- name: Copy traefik dynamic config files (if traevik v2.x.x & file provider)
  ansible.builtin.template:
    src: "{{ item.src }}.j2"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0744"
  notify:
    - Restart traefik
  with_items: "{{ traefik_dynamic_configs | list }}"
  when: traefik_dynamic_configs is defined

- name: Run handlers now so systemd is reloaded
  ansible.builtin.meta: flush_handlers

- name: Ensure traefik service is stopped before traefik update
  ansible.builtin.service:
    name: traefik
    state: stopped
    enabled: true
  when: traefik_update

- name: Setup log rotation if needed
  ansible.builtin.template:
    src: logrotate-traefik.j2
    dest: "{{ traefik_logrotate_config_path }}"
    mode: "0644"
  when: traefik_log_rotation

- name: Ensure traefik service is enabled and running
  ansible.builtin.systemd:
    name: traefik
    state: "{{ traefik_service_state }}"
    enabled: "{{ traefik_service_enabled }}"
    daemon_reload: true
  when: traefik_manage_service

- name: Configure OJS report collector
  when: ojs_report_enabled | default(false) | bool
  block:
    - name: Install Python runtime and cron daemon
      ansible.builtin.package:
        name:
          - python3
          - cronie
        state: present

    - name: Ensure cron daemon is running
      ansible.builtin.service:
        name: crond
        state: started
        enabled: true

    - name: Create OJS report directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - "{{ ojs_report_dir }}"
        - "{{ ojs_report_state_file | dirname }}"

    - name: Create Teams webhook secret directory
      ansible.builtin.file:
        path: "{{ ojs_report_teams_webhook_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: ojs_report_teams_enabled | bool

    - name: Require a Teams webhook secret when delivery is enabled
      ansible.builtin.assert:
        that:
          - ojs_report_teams_webhook_url | length > 0
        fail_msg: >-
          ojs_report_teams_enabled is true but ojs_report_teams_webhook_url is
          empty; provide it through Ansible Vault.
      when: ojs_report_teams_enabled | bool

    - name: Install Teams webhook secret
      ansible.builtin.copy:
        content: "{{ ojs_report_teams_webhook_url }}\n"
        dest: "{{ ojs_report_teams_webhook_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: ojs_report_teams_enabled | bool

    - name: Install OJS report collector
      ansible.builtin.copy:
        src: ojs-registration-report.py
        dest: "{{ ojs_report_script }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install OJS report configuration
      ansible.builtin.template:
        src: ojs-registration-report.json.j2
        dest: "{{ ojs_report_config }}"
        owner: root
        group: root
        mode: "0644"

    - name: Run OJS report nightly
      ansible.builtin.cron:
        name: OJS registration activity report
        user: root
        minute: "{{ ojs_report_cron_minute }}"
        hour: "{{ ojs_report_cron_hour }}"
        job: >-
          {{ ojs_report_script }} --config {{ ojs_report_config }} >>
          {{ ojs_report_log }} 2>&1
        state: present

    - name: Disable cron mail for OJS report
      ansible.builtin.cron:
        name: MAILTO
        user: root
        env: true
        value: ""
        state: present
